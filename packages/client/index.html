<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Among Us Clone</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      #game-screen { position: fixed; inset: 0; max-width: none; padding: 0; overflow: hidden; background: #0b0f1a; }
      #game-container { position: absolute; inset: 0; }
      #game-container canvas { display: block; }
      .role-badge {
        position: fixed; top: 12px; right: 12px;
        background: rgba(0,0,0,0.7); color: #fff;
        padding: 8px 16px; border-radius: 8px;
        font-weight: bold; z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <section id="login-screen" class="screen">
        <div class="card">
          <h1>🚀 AMONG US</h1>
          <input id="login-username" type="text" placeholder="Kullanıcı adı" maxlength="20" />
          <input id="login-password" type="password" placeholder="Şifre" />
          <div class="button-row">
            <button id="btn-login">Giriş Yap</button>
            <button id="btn-register" class="secondary">Kayıt Ol</button>
          </div>
          <p id="login-error" class="error"></p>
        </div>
      </section>

      <section id="menu-screen" class="screen" hidden>
        <div class="card">
          <div class="menu-header">
            <h2>Merhaba, <span id="menu-username"></span>!</h2>
            <button id="btn-logout" class="link">Çıkış</button>
          </div>
          <div class="menu-actions">
            <div class="action-box">
              <h3>ODA OLUŞTUR</h3>
              <input id="create-password" type="password" placeholder="Şifre (opsiyonel)" />
              <button id="btn-create">Yeni Oda</button>
            </div>
            <div class="action-box">
              <h3>KOD İLE KATIL</h3>
              <input id="join-code" type="text" placeholder="A4KQ9Z" maxlength="6" />
              <input id="join-password" type="password" placeholder="Şifre (opsiyonel)" />
              <button id="btn-join">Katıl</button>
            </div>
          </div>
          <button id="btn-stats" class="secondary menu-stats">📊 İstatistikler</button>
          <p id="menu-error" class="error"></p>
        </div>
      </section>

      <section id="lobby-screen" class="screen" hidden>
        <div class="card lobby">
          <div class="lobby-header">
            <h2>Oda: <span id="lobby-code"></span></h2>
            <button id="btn-copy-code" class="link">Kopyala</button>
          </div>
          <div id="players-list" class="players-list"></div>
          <div class="color-picker">
            <h3>Renk:</h3>
            <div id="color-buttons"></div>
          </div>
          <div class="lobby-actions">
            <button id="btn-ready">Hazır Değil</button>
            <button id="btn-leave" class="secondary">Çıkış</button>
            <button id="btn-start" class="primary" hidden>BAŞLAT</button>
          </div>
          <p id="lobby-error" class="error"></p>
        </div>
      </section>

      <section id="game-screen" class="screen" hidden>
        <div id="game-container"></div>
        <div class="role-badge" id="role-display"></div>
        <button id="sound-btn" class="sound-btn" title="Sesi aç/kapat">🔊</button>
        <div id="minigame-overlay" class="minigame-overlay" hidden>
          <div class="minigame-card">
            <h3 id="minigame-title"></h3>
            <div id="minigame-content"></div>
          </div>
        </div>
        <div id="monitor-panel" class="monitor-panel" hidden>
          <div class="monitor-header">
            <h3 id="monitor-title">MONİTÖR</h3>
            <button id="monitor-close" class="link">✕ Kapat</button>
          </div>
          <div id="monitor-content" class="monitor-content"></div>
        </div>
        <div id="task-progress" class="task-progress" hidden>
          Görevler: <span id="task-completed">0</span>/<span id="task-total">0</span>
        </div>
        <button id="kill-btn" class="kill-btn" hidden>🔪</button>
        <button id="report-btn" class="report-btn" hidden>📢</button>
        <button id="sabotage-btn" class="sabotage-btn" hidden>⚡</button>
        <div id="sabotage-menu" class="sabotage-menu" hidden>
          <button data-sab="lights">💡 Lights</button>
          <button data-sab="comms">📡 Comms</button>
          <button data-sab="reactor">☢️ Reactor</button>
          <button data-sab="o2">🫧 O2</button>
        </div>
        <div id="vent-menu" class="vent-menu" hidden>
          <h3>VENT SEÇ</h3>
          <div id="vent-list"></div>
          <button id="vent-exit-btn">Çık</button>
        </div>
        <div id="sabotage-alert" class="sabotage-alert" hidden></div>
        <div id="interact-prompt" class="interact-prompt" hidden>E bas</div>
        <div id="game-over" class="game-over" hidden>
          <h1 id="winner-text"></h1>
          <button id="back-to-lobby">Lobiye Dön</button>
        </div>
      </section>

      <section id="meeting-screen" class="screen meeting" hidden>
        <div class="meeting-card">
          <h2 id="meeting-title">📢 MEETING</h2>
          <p id="meeting-timer">⏱️ 90 saniye</p>
          <div id="meeting-chat" class="meeting-chat"></div>
          <div id="vote-buttons" class="vote-buttons"></div>
          <div class="chat-input-row">
            <input id="chat-input" type="text" placeholder="Mesaj yaz..." maxlength="200" />
            <button id="chat-send">Gönder</button>
          </div>
        </div>
      </section>

      <section id="stats-screen" class="screen" hidden>
        <div class="card stats-card">
          <div class="menu-header">
            <h2>📊 İstatistikler</h2>
            <button id="btn-stats-back" class="link">← Geri</button>
          </div>
          <div id="my-stats" class="my-stats"></div>
          <h3>🏆 En İyiler</h3>
          <div class="stats-table-wrap">
            <table class="stats-table">
              <thead>
                <tr><th>#</th><th>Oyuncu</th><th>O</th><th>G</th><th>M</th><th>%</th></tr>
              </thead>
              <tbody id="leaderboard-body"></tbody>
            </table>
          </div>
          <p id="stats-error" class="error"></p>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
